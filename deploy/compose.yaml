services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      STOMP_ORIGIN: https://${DOMAIN:?Set DOMAIN to your domain}
    volumes:
      - accounts:/app/data
    expose:
      - "8080"
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 20s
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  accounts:
  caddy_data:
  caddy_config:
