name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-dev maven python3

      - name: Build and test TPC and Reactor
        env:
          TMPDIR: /tmp
        run: python3 scripts/test_all.py

      - name: Save server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: /tmp/stomp-test-logs-*/*.log
          if-no-files-found: ignore
          retention-days: 7
